# ===================================================================
# Prometheus - what it scrapes on the Materia host (staging and prod)
# Every target is a container of the compose stack, reached on the
# internal network; nothing here is published outside the host.
# ===================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Spring Boot: HTTP traffic, JVM, database pool, Flyway... (actuator on its internal port)
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]

  # Identity: sign-ins, token refreshes, account and employee management
  - job_name: identity
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity:8081"]

  # Master data: catalogue and stock management, the nightly reorder check
  - job_name: masterdata
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["masterdata:8081"]

  # Finance: invoices, payments, settings
  - job_name: finance
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["finance:8081"]

  # The API gateway: every request from outside, refusals (401, 429) included
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8081"]

  # The host: CPU, memory, disk of the instance
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # PostgreSQL: connections, transactions, database size
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
