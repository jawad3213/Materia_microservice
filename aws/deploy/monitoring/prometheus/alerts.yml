# ===================================================================
# Alert rules. "critical" alerts are also checked by the production
# deploy (monitoring stage): a release that fires one is rolled back.
# Firing alerts show in Grafana and at http://localhost:9090/alerts
# (through the SSM port forward, see aws/README.md).
# ===================================================================
groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not answering Prometheus"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable from its exporter"

  - name: backend
    rules:
      - alert: BackendHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="backend", uri!~"/actuator.*", status=~"5.."}[5m]))
            /
          sum(rate(http_server_requests_seconds_count{job="backend", uri!~"/actuator.*"}[5m]))
            > 0.05
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of API requests fail with a 5xx ({{ $value | humanizePercentage }})"

      - alert: BackendSlowResponses
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="backend", uri!~"/actuator.*"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 1s ({{ $value | humanizeDuration }})"

      - alert: JvmHeapAlmostFull
        expr: |
          sum(jvm_memory_used_bytes{job="backend", area="heap"})
            /
          sum(jvm_memory_max_bytes{job="backend", area="heap"} > 0)
            > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend heap above 90% for 10 minutes"

      - alert: DatabasePoolExhausted
        expr: max(hikaricp_connections_pending{job="backend"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Requests are waiting for a database connection"

  - name: host
    rules:
      - alert: HostDiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{job="node", mountpoint=~"/|/data", fstype!~"tmpfs|overlay"}
            /
          node_filesystem_size_bytes{job="node", mountpoint=~"/|/data", fstype!~"tmpfs|overlay"}
            < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 10% free on {{ $labels.mountpoint }}"

      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% of the memory is available"

      - alert: HostHighCpu
        expr: 1 - avg(rate(node_cpu_seconds_total{job="node", mode="idle"}[5m])) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 90% for 15 minutes"

  # Events between services (outbox -> Kafka -> consumers). Warnings, not critical: none is a reason to roll a
  # release back, but each means an event is late or waiting for someone.
  - name: messaging
    rules:
      - alert: OutboxBacklog
        expr: materia_outbox_pending > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} has {{ $value }} events waiting to be published: is Kafka reachable?"

      - alert: OutboxParkedEvents
        expr: materia_outbox_parked > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} parked {{ $value }} events it can never publish: see outbox_messages.last_error"

      - alert: EventsDeadLettered
        expr: increase(materia_events_dead_lettered_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} could not apply an event after its retries: it is in the dead-letter topic of group {{ $labels.group }}"

      - alert: ConsumerLagHigh
        expr: max by (job) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} is {{ $value }} events behind on Kafka"
