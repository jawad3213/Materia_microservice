# ===================================================================
# Materia Production Override Compose (docker-compose.prod.yml)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ===================================================================
services:

  # -----------------------------------------------------------------
  # PostgreSQL (Prod: strictly internal network, restart always)
  # -----------------------------------------------------------------
  postgres:
    restart: always

  # -----------------------------------------------------------------
  # Kafka (Prod: strictly internal network, restart always)
  # -----------------------------------------------------------------
  kafka:
    restart: always

  # -----------------------------------------------------------------
  # Backend (Prod: prod profile, strict CORS, resource constraints)
  # -----------------------------------------------------------------
  backend:
    restart: always
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # -----------------------------------------------------------------
  # Gateway: reached by the frontend's nginx only
  # -----------------------------------------------------------------
  gateway:
    restart: always

  # -----------------------------------------------------------------
  # Frontend (Prod: production domain API, port 80, resource limits)
  # -----------------------------------------------------------------
  frontend:
    restart: always
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    deploy:
      resources:
        limits:
          memory: 512M
