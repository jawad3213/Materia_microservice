name: Deploy to EC2 (reusable)

# Deploy images already in this environment's ECR repositories on its EC2 host, through SSM Run Command
# (.github/scripts/ssm-run.sh). Staging gets the images CI built and tested; production gets the same images,
# promoted from staging by cd-production.yml. Nothing is rebuilt here. With the application, the command ships
# the monitoring stack's configuration (aws/deploy/monitoring) and its post-deploy check.
# AWS access is keyless: the job exchanges its GitHub OIDC token for the
# environment's deploy role (aws/modules/github_deploy_role).
#
# GitHub environment variables (Settings > Environments > <env>):
#   AWS_DEPLOY_ROLE_ARN  - terraform output github_deploy_role_arn
#   AWS_REGION           - optional, defaults to eu-west-3

on:
  workflow_call:
    inputs:
      environment:
        description: "Terraform environment: staging or prod"
        type: string
        required: true
      github_environment:
        description: "GitHub environment holding the deploy variables (staging / production)"
        type: string
        required: true
      image_tag:
        description: "Image tag pushed by CI: the commit SHA it built"
        type: string
        required: true
    outputs:
      previous_tag:
        description: "Tag that was running before this deploy (empty on a first deploy): what a rollback redeploys"
        value: ${{ jobs.deploy.outputs.previous_tag }}
      backend_image:
        description: "Backend image now running, as repository@digest"
        value: ${{ jobs.deploy.outputs.backend_image }}
      frontend_image:
        description: "Frontend image now running, as repository@digest"
        value: ${{ jobs.deploy.outputs.frontend_image }}

permissions:
  id-token: write
  contents: read

env:
  PROJECT: materia
  APP_DIR: /opt/materia

jobs:
  deploy:
    name: Deploy to EC2 (${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.run.outputs.previous_tag }}
      backend_image: ${{ steps.run.outputs.backend_image }}
      frontend_image: ${{ steps.run.outputs.frontend_image }}
    environment: ${{ inputs.github_environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-west-3' }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      # ---------------------------------------------------------------
      # AWS (OIDC) and images
      # ---------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-${{ github.run_id }}-${{ inputs.environment }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check the images exist in ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for SERVICE in backend identity masterdata finance analytics gateway frontend; do
            REPOSITORY="$PROJECT-$ENVIRONMENT-$SERVICE"
            if ! aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" >/dev/null; then
              echo "::error::$REPOSITORY:$IMAGE_TAG is not in ECR. Images are pushed by the CI workflow: let it finish on this commit first."
              exit 1
            fi
          done

      # ---------------------------------------------------------------
      # Deploy through SSM Run Command (no SSH, no open port)
      # ---------------------------------------------------------------
      - name: Find the instance
        id: instance
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=$PROJECT" "Name=tag:Environment,Values=$ENVIRONMENT" \
                      "Name=tag:Role,Values=app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$ID" ] || [ "$(wc -w <<<"$ID")" -ne 1 ]; then
            echo "::error::Expected exactly one running $PROJECT/$ENVIRONMENT app instance, found: '${ID}'"
            exit 1
          fi
          PING=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$ID" \
            --query 'InstanceInformationList[0].PingStatus' --output text)
          if [ "$PING" != "Online" ]; then
            echo "::error::Instance $ID is not connected to SSM (status: $PING)"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Run deploy on the instance
        id: run
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # Shipped with the command: the compose stack, the deploy script and the monitoring configuration
          COMPOSE_B64=$(base64 -w0 aws/deploy/docker-compose.yml)
          DEPLOY_B64=$(base64 -w0 aws/deploy/deploy.sh)
          CHECK_B64=$(base64 -w0 aws/deploy/check-monitoring.sh)
          MONITORING_B64=$(tar -czf - -C aws/deploy monitoring | base64 -w0)
          jq -n \
            --arg dir "$APP_DIR" --arg compose "$COMPOSE_B64" --arg deploy "$DEPLOY_B64" \
            --arg check "$CHECK_B64" --arg monitoring "$MONITORING_B64" \
            --arg run "PROJECT=$PROJECT ENVIRONMENT=$ENVIRONMENT AWS_REGION=$AWS_REGION REGISTRY=$REGISTRY IMAGE_TAG=$IMAGE_TAG APP_DIR=$APP_DIR $APP_DIR/deploy.sh" \
            '{
              commands: [
                "set -euo pipefail",
                "mkdir -p \($dir)",
                "echo \($compose) | base64 -d > \($dir)/docker-compose.yml",
                "echo \($deploy) | base64 -d > \($dir)/deploy.sh",
                "echo \($check) | base64 -d > \($dir)/check-monitoring.sh",
                "chmod 700 \($dir)/deploy.sh \($dir)/check-monitoring.sh",
                "rm -rf \($dir)/monitoring && echo \($monitoring) | base64 -d | tar -xz -C \($dir)",
                "chmod -R a+rX \($dir)/monitoring",
                $run
              ],
              executionTimeout: ["1200"]
            }' > ssm-params.json

          bash .github/scripts/ssm-run.sh "$INSTANCE_ID" "materia $ENVIRONMENT deploy ${IMAGE_TAG:0:12}" ssm-params.json deploy-output.txt

          # Lines printed by deploy.sh for the next stages
          {
            echo "previous_tag=$(awk '$1 == "PREVIOUS_TAG" { print $2 }' deploy-output.txt | tail -1)"
            echo "backend_image=$(awk '$1 == "DEPLOYED_IMAGE" && $2 == "backend" { print $3 }' deploy-output.txt | tail -1)"
            echo "frontend_image=$(awk '$1 == "DEPLOYED_IMAGE" && $2 == "frontend" { print $3 }' deploy-output.txt | tail -1)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed \`${IMAGE_TAG:0:12}\` to $ENVIRONMENT ($INSTANCE_ID)"
            grep '^DEPLOYED_IMAGE' deploy-output.txt | awk '{ print "- " $2 ": `" $3 "`" }'
          } >> "$GITHUB_STEP_SUMMARY"
