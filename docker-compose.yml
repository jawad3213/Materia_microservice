# ===================================================================
# Materia Base Compose (Backbone for dev, staging, prod)
# ===================================================================

# Each service's database user (one database per service): it owns its schema and nothing else, as on EC2.
# aws/deploy/db/service-roles.sql creates them, run by the PostgreSQL admin before the backend starts and again once
# it has migrated (db-roles, db-roles-handover). The passwords default to local-only values; set DB_PASSWORD_* in
# .env to change them.
x-db-roles: &db-roles
  image: postgres:16-alpine
  environment:
    PGPASSWORD: ${POSTGRES_PASSWORD}
  volumes:
    - ./aws/deploy/db:/db:ro
  entrypoint:
    - psql
    - -q
    - -v
    - ON_ERROR_STOP=1
    - -h
    - postgres
    - -U
    - ${POSTGRES_USER}
    - -d
    - ${POSTGRES_DB}
    - -v
    - identity_password=${DB_PASSWORD_IDENTITY:-materia_identity_local}
    - -v
    - masterdata_password=${DB_PASSWORD_MASTERDATA:-materia_masterdata_local}
    - -v
    - procurement_password=${DB_PASSWORD_PROCUREMENT:-materia_procurement_local}
    - -v
    - finance_password=${DB_PASSWORD_FINANCE:-materia_finance_local}
    - -v
    - analytics_password=${DB_PASSWORD_ANALYTICS:-materia_analytics_local}
    - -f
    - /db/service-roles.sql
  restart: "no"
  networks:
    - materia-net

services:

  # -----------------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: materia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - materia-net

  # -----------------------------------------------------------------
  # The services' database users: before the backend starts, then handing the schemas its legacy migrations create
  # to their services before those start (see x-db-roles)
  # -----------------------------------------------------------------
  db-roles:
    <<: *db-roles
    container_name: materia-db-roles
    depends_on:
      postgres:
        condition: service_healthy

  db-roles-handover:
    <<: *db-roles
    container_name: materia-db-roles-handover
    depends_on:
      backend:
        condition: service_healthy

  # -----------------------------------------------------------------
  # Apache Kafka (KRaft Mode)
  # -----------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: materia-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:${KAFKA_PORT},PLAINTEXT://kafka:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    networks:
      - materia-net

  # -----------------------------------------------------------------
  # Materia Backend (Spring Boot with Java 21)
  # -----------------------------------------------------------------
  backend:
    build:
      context: ./backend/monolith
      dockerfile: Dockerfile
    container_name: materia-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: materia_procurement
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_PROCUREMENT:-materia_procurement_local}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      # Events cross services through Kafka (master data keeps stock from procurement's events): the outbox relay
      # publishes the committed events of the shared outbox to materia.<context>.events.
      APP_MESSAGING_TYPE: kafka
      APP_OUTBOX_RELAY_ENABLED: "true"
      # Verifies tokens only: identity alone signs them, and issues this service's own service tokens.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SERVICE_CLIENT_ID: monolith
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_MONOLITH_SECRET}
      GRPC_IDENTITY_TARGET: identity:9091
      GRPC_MASTERDATA_TARGET: masterdata:9092
    volumes:
      - attachments_data:/app/data/attachments
    depends_on:
      db-roles:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    # Healthy once migrated, when the services' schemas are handed over (db-roles-handover). Liveness, not readiness:
    # it is up once the context has started (Flyway has run), before the dev seed, which waits for identity.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - materia-net

  # -----------------------------------------------------------------
  # Identity: sign-in, accounts, employees; the only signer of tokens.
  # REST on 8082 (through the gateway), gRPC identity.v1 on 9091 (for the other services).
  # Connects as its own database user; starts once the backend has migrated and its schema is handed over.
  # Build its jar first: cd backend && ./mvnw -pl identity-service -am package -DskipTests
  # -----------------------------------------------------------------
  identity:
    build:
      context: ./backend/identity-service
      dockerfile: Dockerfile
    container_name: materia-identity
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: materia_identity
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_IDENTITY:-materia_identity_local}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SERVICE_CLIENT_MONOLITH_SECRET: ${SERVICE_CLIENT_MONOLITH_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SERVICE_CLIENT_MASTERDATA_SECRET: ${SERVICE_CLIENT_MASTERDATA_SECRET}
      SERVICE_CLIENT_FINANCE_SECRET: ${SERVICE_CLIENT_FINANCE_SECRET}
      SERVICE_CLIENT_ANALYTICS_SECRET: ${SERVICE_CLIENT_ANALYTICS_SECRET}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db-roles-handover:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - materia-net

  # -----------------------------------------------------------------
  # Master data: materials, categories, suppliers, stock.
  # REST on 8083 (through the gateway), gRPC masterdata.v1 on 9092 (for the other services). Keeps stock from
  # procurement's events (Kafka) and raises replenishment requisitions in the backend (gRPC 9090).
  # Connects as its own database user; starts once the backend has migrated and its schema is handed over.
  # Build its jar first: cd backend && ./mvnw -pl masterdata-service -am package -DskipTests
  # -----------------------------------------------------------------
  masterdata:
    build:
      context: ./backend/masterdata-service
      dockerfile: Dockerfile
    container_name: materia-masterdata
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: materia_masterdata
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_MASTERDATA:-materia_masterdata_local}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SERVICE_CLIENT_MASTERDATA_SECRET: ${SERVICE_CLIENT_MASTERDATA_SECRET}
      GRPC_IDENTITY_TARGET: identity:9091
      GRPC_MONOLITH_TARGET: backend:9090
    depends_on:
      db-roles-handover:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - materia-net

  # -----------------------------------------------------------------
  # Finance: invoices (matched against procurement's orders and receipts), payments, settings.
  # REST on 8084 (through the gateway), gRPC finance.v1 on 9093 (for the dashboard); reads procurement on the backend
  # (gRPC 9090). Keeps its own attachment files (supplier invoice scans).
  # Connects as its own database user; starts once the backend has migrated and its schema is handed over.
  # Build its jar first: cd backend && ./mvnw -pl finance-service -am package -DskipTests
  # -----------------------------------------------------------------
  finance:
    build:
      context: ./backend/finance-service
      dockerfile: Dockerfile
    container_name: materia-finance
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: materia_finance
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_FINANCE:-materia_finance_local}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SERVICE_CLIENT_FINANCE_SECRET: ${SERVICE_CLIENT_FINANCE_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      GRPC_IDENTITY_TARGET: identity:9091
      GRPC_MONOLITH_TARGET: backend:9090
    volumes:
      - finance_attachments_data:/app/data/attachments
    depends_on:
      db-roles-handover:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - materia-net

  # -----------------------------------------------------------------
  # Analytics: the dashboard, composed from the other services' figures (gRPC: procurement on the backend, master
  # data, finance). REST on 8085 (through the gateway); serves no contract and owns no table.
  # Connects as its own database user; starts once the backend has migrated and its schema is handed over.
  # Build its jar first: cd backend && ./mvnw -pl analytics-service -am package -DskipTests
  # -----------------------------------------------------------------
  analytics:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: materia-analytics
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: materia_analytics
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_ANALYTICS:-materia_analytics_local}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SERVICE_CLIENT_ANALYTICS_SECRET: ${SERVICE_CLIENT_ANALYTICS_SECRET}
      GRPC_IDENTITY_TARGET: identity:9091
      GRPC_MONOLITH_TARGET: backend:9090
      GRPC_MASTERDATA_TARGET: masterdata:9092
      GRPC_FINANCE_TARGET: finance:9093
    depends_on:
      db-roles-handover:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - materia-net

  # -----------------------------------------------------------------
  # API Gateway (Spring Cloud Gateway): the only way in to the services.
  # Routes /api/v1/auth, /api/v1/employees and the JWK set to identity, /api/v1/masterdata to master data,
  # /api/v1/invoices, /api/v1/payments and /api/v1/settings to finance, /api/v1/dashboard to analytics, the rest of
  # /api to the backend;
  # refuses invalid tokens, rate-limits clients.
  # Build its jar first: cd backend && ./mvnw -pl gateway-service -am package -DskipTests
  # -----------------------------------------------------------------
  gateway:
    build:
      context: ./backend/gateway-service
      dockerfile: Dockerfile
    container_name: materia-gateway
    environment:
      GATEWAY_BACKEND_URI: http://backend:8080
      GATEWAY_IDENTITY_URI: http://identity:8082
      GATEWAY_MASTERDATA_URI: http://masterdata:8083
      GATEWAY_FINANCE_URI: http://finance:8084
      GATEWAY_ANALYTICS_URI: http://analytics:8085
    depends_on:
      backend:
        condition: service_started
      identity:
        condition: service_started
      masterdata:
        condition: service_started
      finance:
        condition: service_started
      analytics:
        condition: service_started
    networks:
      - materia-net

  # -----------------------------------------------------------------
  # Materia Frontend (React + Vite served via Nginx); nginx proxies /api to the gateway
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: materia-frontend
    depends_on:
      gateway:
        condition: service_started
    networks:
      - materia-net

# ===================================================================
# Shared Volumes & Networks
# ===================================================================
volumes:
  postgres_data:
    driver: local
  attachments_data:
    driver: local
  finance_attachments_data:
    driver: local

networks:
  materia-net:
    driver: bridge
