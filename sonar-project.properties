# SonarQube analysis of the whole repository (run by the CI workflow's "SonarQube" stage).
# The project key and, for SonarCloud, the organization come from the workflow (vars.SONAR_PROJECT_KEY,
# vars.SONAR_ORGANIZATION), so this file holds no server-specific value.
sonar.projectName=Materia
sonar.sourceEncoding=UTF-8

# ---- Sources and tests ----
sonar.sources=backend/materia-common/src/main/java,backend/materia-grpc/src/main/java,backend/monolith/src/main/java,backend/gateway-service/src/main/java,frontend/src
sonar.tests=backend/materia-grpc/src/test/java,backend/monolith/src/test/java,backend/gateway-service/src/test/java,frontend/src
sonar.test.inclusions=frontend/src/**/__tests__/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=frontend/src/**/__tests__/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,\
  frontend/src/**/*.svg,frontend/src/**/*.css

# ---- Java (compiled by the CI unit-test stage) ----
sonar.java.source=21
sonar.java.binaries=backend/materia-common/target/classes,backend/materia-grpc/target/classes,backend/monolith/target/classes,backend/gateway-service/target/classes
sonar.java.test.binaries=backend/materia-grpc/target/test-classes,backend/monolith/target/test-classes,backend/gateway-service/target/test-classes
sonar.java.libraries=backend/monolith/target/dependency/*.jar,backend/materia-grpc/target/dependency/*.jar,backend/gateway-service/target/dependency/*.jar

# ---- Coverage: unit + integration tests merged (JaCoCo), and the frontend unit tests (Vitest, LCOV) ----
sonar.coverage.jacoco.xmlReportPaths=backend/monolith/target/site/jacoco-aggregate/jacoco.xml,backend/materia-grpc/target/site/jacoco/jacoco.xml,backend/gateway-service/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Same scope as the JaCoCo gate: plumbing that has no logic of its own.
sonar.coverage.exclusions=backend/**/dtos/**,backend/**/config/**,backend/**/*JpaEntity*,backend/**/mappers/**,\
  backend/**/*Application.java,frontend/src/main.tsx

# The pipeline waits for the quality gate and fails when it is red.
sonar.qualitygate.wait=true
