# ===================================================================
server.port=8080
spring.application.name=${SPRING_APPLICATION_NAME:procurement-service}
# Spring Boot Base Configuration (Shared across all environments)
# ===================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Common Driver & Hibernate Settings
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.jdbc.batch_size=${SPRING_JPA_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=${SPRING_JPA_ORDER_INSERTS:true}
spring.jpa.properties.hibernate.order_updates=${SPRING_JPA_ORDER_UPDATES:true}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.format-sql=${SPRING_JPA_FORMAT_SQL:false}

# The schema belongs to Flyway (db/migration) in every environment. Hibernate only checks that the entities
# match it and fails the start when they do not; it never creates or alters a table. Deliberately not
# configurable: a new column or table is a new migration.
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate

# Procurement's (this application's) tables and its copy of the shared kernel's (change history, outbox, inbox, code sequences,
# attachments, exchange rates) are in the procurement schema, which its connection sees alone: no other service's
# tables, nor the public ones every service shared before (one database per service, phase 6). The shared
# kernel's entities, which name no schema, and native SQL find their tables there.
spring.datasource.hikari.connection-init-sql=SET search_path TO procurement

# This service's client credentials, which identity exchanges for a service token (identity.v1.ServiceTokens) when
# it calls another service for work no user started.
app.service-client.id=${SERVICE_CLIENT_ID:procurement}
app.service-client.secret=${SERVICE_CLIENT_SECRET}
# Identity's gRPC server (identity.v1: UserDirectory, ServiceTokens): host:port.
app.grpc.identity.target=${GRPC_IDENTITY_TARGET:localhost:9091}
app.grpc.identity.deadline=${GRPC_IDENTITY_DEADLINE:5s}
# Master data's gRPC server (masterdata.v1.MaterialCatalog): host:port.
app.grpc.masterdata.target=${GRPC_MASTERDATA_TARGET:localhost:9092}
app.grpc.masterdata.deadline=${GRPC_MASTERDATA_DEADLINE:5s}
# This application's contracts, for the other services (master data raises replenishment requisitions here, finance
# reads orders and receipts, analytics procurement's figures).
app.grpc.server.port=${GRPC_SERVER_PORT:9090}

spring.flyway.default-schema=${SPRING_FLYWAY_DEFAULT_SCHEMA:public}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-migration-patterns=*:missing

# ===================================================================
# Swagger / OpenAPI Properties (SpringDoc)
# ===================================================================
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.info.title=${SPRINGDOC_INFO_TITLE:Materia Procurement API}
springdoc.info.description=${SPRINGDOC_INFO_DESCRIPTION:Materia procure-to-pay API}
springdoc.info.version=${SPRINGDOC_INFO_VERSION:1.0.0}
springdoc.info.contact.name=${SPRINGDOC_INFO_CONTACT_NAME:Materia}
springdoc.info.contact.email=${SPRINGDOC_INFO_CONTACT_EMAIL:support@materia.com}

# ===================================================================
# Messaging Strategy ('spring' for in-process events, 'kafka' for distributed broker)
# Kafka by default: master data is a service of its own, and the stock events (StockOnOrderChanged,
# GoodsReceiptLineReceived, ReplacementPutOnOrder, ReceiptStockApplied) only cross services through it. Each
# service's relay publishes its own outbox; this application's, procurement's.
# ===================================================================
app.messaging.type=${APP_MESSAGING_TYPE:kafka}
app.outbox.relay.enabled=${APP_OUTBOX_RELAY_ENABLED:true}

# ===================================================================
# Kafka Base Configuration (Active when app.messaging.type=kafka)
# ===================================================================
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:materia}
spring.kafka.consumer.auto-offset-reset=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.listener.auto-startup=${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}
# ===================================================================
# JWT Security Configuration
# ===================================================================
# Access tokens are signed with RS256 by identity alone; this application only verifies them, with the public key
# (PEM, or the Base64 of the PEM). It holds no private key: its own service tokens come from identity.
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ===================================================================
# Security & CORS Configuration
# ===================================================================
# Only the sign-in flow, API docs and health checks are open; everything else needs a session.
# (Master data, the Kafka test endpoint and the other actuator endpoints used to be public here.)
app.security.public-endpoints=${APP_SECURITY_PUBLIC_ENDPOINTS:/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/logout,/api/v1/auth/forgot-password,/api/v1/auth/reset-password,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/actuator/health,/actuator/health/**,/actuator/info,/error}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Refresh-token cookie attributes.
# Dev (http://localhost) needs Secure=false; any HTTPS deployment must set it to true.
# Keep SameSite=Strict while the SPA and the API share a site; set it to None
# (which forces Secure) when they are served from different sites.
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

# ===================================================================
# Gateway Rate Limiting
# ===================================================================
gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.max-requests-per-minute=${GATEWAY_RATE_LIMIT_MAX_RPM:120}
# Tighter quota for /auth/login, /auth/forgot-password and /auth/reset-password
gateway.rate-limit.max-auth-requests-per-minute=${GATEWAY_RATE_LIMIT_AUTH_MAX_RPM:10}

# ===================================================================
# Actuator & Health Check Configuration (AWS ALB & ECS Fargate)
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
# Metrics: every series carries the application name; request latencies keep a histogram so that Prometheus
# can compute percentiles (p95, p99). The prometheus endpoint is exposed only where the deployment puts the
# actuator on its own internal port (MANAGEMENT_SERVER_PORT, see aws/deploy/docker-compose.yml).
management.metrics.tags.application=materia
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===================================================================
# Mail / SMTP Configuration
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${APP_MAIL_FROM:noreply@materia.com}
app.mail.reset-password-base-url=${APP_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
app.mail.login-base-url=${APP_LOGIN_URL:http://localhost:5173/signin}


# First administrator of a fresh install: created only while the users table is empty, with a new password
# required at the first sign-in. Remove the variables once the account exists.
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# VAT rate (percent) of an order line that does not give one. Invoice lines are checked against their order
# line's rate: a different VAT blocks verification like a price or quantity discrepancy.
app.tax.default-rate=${APP_TAX_DEFAULT_RATE:20}

# Reporting currency: every amount across documents (dashboard) is shown in it. Committed documents keep the
# rate of their own date; rates are stored daily by a job (first run at start-up).
app.reporting-currency=${APP_REPORTING_CURRENCY:MAD}
app.fx.refresh.enabled=${APP_FX_REFRESH_ENABLED:true}
app.fx.refresh.cron=${APP_FX_REFRESH_CRON:0 30 5 * * *}
# @Scheduled jobs (the nightly reorder check at 06:00).
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}

# Attachments (supplier invoice scans, delivery notes, quality photos): files under storage-dir, metadata in the
# attachments table. On EC2 the directory is /data/attachments, on the snapshotted data volume.
app.attachments.storage-dir=${APP_ATTACHMENTS_DIR:data/attachments}
app.attachments.max-file-size-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
