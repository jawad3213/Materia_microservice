spring.application.name=procurement-service

# TLS is terminated at the load balancer, so trust X-Forwarded-* for
# request.isSecure() and generated URLs.
server.forward-headers-strategy=framework

# Database schema: Flyway builds it from db/migration (V1__init.sql, then V2__..., V3__...) and Hibernate only
# validates that the entities match it, failing the start when they do not. Strict on purpose: an empty
# database is migrated, a database with unknown or altered migrations is refused instead of patched.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.ignore-migration-patterns=*:future
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false

# The API documentation (Swagger UI, OpenAPI) is for development and staging, whose security scan reads it: not
# served in production, where it would only show an attacker every route.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
