# ===================================================================
# Analytics service: the dashboard, composed from the other services' figures
# ===================================================================
server.port=${SERVER_PORT:8085}
spring.application.name=${SPRING_APPLICATION_NAME:analytics-service}
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.jdbc.batch_size=${SPRING_JPA_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=${SPRING_JPA_ORDER_INSERTS:true}
spring.jpa.properties.hibernate.order_updates=${SPRING_JPA_ORDER_UPDATES:true}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.format-sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate

# Analytics owns no table of its own yet; its copy of the shared kernel's (change history, outbox, inbox, code sequences,
# attachments, exchange rates) are in the analytics schema, which its connection sees alone: no other service's
# tables, nor the public ones every service shared before (one database per service, phase 6). The shared
# kernel's entities, which name no schema, and native SQL find their tables there.
spring.datasource.hikari.connection-init-sql=SET search_path TO analytics

# Analytics' migrations (db/analytics: today only the check that the shared tables exist), with their own history in
# the analytics schema. Baseline 0, so that V1 runs on a database the monolith set up.
spring.flyway.schemas=analytics
spring.flyway.default-schema=analytics
spring.flyway.table=flyway_schema_history
spring.flyway.locations=classpath:db/analytics
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ===================================================================
# gRPC: the reporting figures of the other services (analytics serves no contract)
# ===================================================================
app.grpc.identity.target=${GRPC_IDENTITY_TARGET:localhost:9091}
app.grpc.identity.deadline=${GRPC_IDENTITY_DEADLINE:5s}
# procurement.v1.ProcurementMetrics, served by the monolith
app.grpc.monolith.target=${GRPC_MONOLITH_TARGET:localhost:9090}
app.grpc.masterdata.target=${GRPC_MASTERDATA_TARGET:localhost:9092}
app.grpc.finance.target=${GRPC_FINANCE_TARGET:localhost:9093}
# This service's client credentials for its service tokens (identity.v1.ServiceTokens).
app.service-client.id=analytics
app.service-client.secret=${SERVICE_CLIENT_ANALYTICS_SECRET}

# The audit log page's platform-wide feed (and its CSV export), composed from every service's change history
# (ServicesAuditFeed): each keeps its own.
app.audit.feed=services

# ===================================================================
# Events: analytics reacts to no event yet (an event-fed read model may replace the hottest metrics calls), and
# publishes none.
# ===================================================================
app.messaging.type=spring
app.outbox.relay.enabled=false

# ===================================================================
# JWT: verified with identity's public key only
# ===================================================================
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ===================================================================
# Security & CORS
# ===================================================================
app.security.public-endpoints=${APP_SECURITY_PUBLIC_ENDPOINTS:/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/actuator/health,/actuator/health/**,/actuator/info,/error}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.max-requests-per-minute=${GATEWAY_RATE_LIMIT_MAX_RPM:120}
gateway.rate-limit.max-auth-requests-per-minute=${GATEWAY_RATE_LIMIT_AUTH_MAX_RPM:10}

springdoc.info.title=${SPRINGDOC_INFO_TITLE:Materia Analytics API}

# ===================================================================
# Actuator
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=materia-analytics
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===================================================================
# Jobs and shared kernel
# ===================================================================
app.scheduling.enabled=false
app.reporting-currency=${APP_REPORTING_CURRENCY:MAD}
# Its own exchange rates (its exchange_rates table), refreshed every day from the exchange-rate service: they value
# its documents and figures in the reporting currency.
app.fx.refresh.enabled=${APP_FX_REFRESH_ENABLED:true}
app.fx.refresh.cron=${APP_FX_REFRESH_CRON:0 30 5 * * *}
app.attachments.storage-dir=${APP_ATTACHMENTS_DIR:data/attachments}
