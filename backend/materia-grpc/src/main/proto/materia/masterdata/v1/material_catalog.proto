syntax = "proto3";

// Served by Master Data. Mirrors the reads of masterData's MaterialInventoryUseCase; its stock changes stay events.
package materia.masterdata.v1;

import "materia/common/v1/types.proto";

option java_package = "com.materia.proto.masterdata.v1";
option java_multiple_files = true;

// Material lookups. Callers: procurement (requisition lines, receipt checks, returns, the dev seeders' orders).
service MaterialCatalog {
  rpc FindMaterial(FindMaterialRequest) returns (FindMaterialResponse);
  rpc FindMaterialByCode(FindMaterialByCodeRequest) returns (FindMaterialResponse);
  // Mirrors OrderableMaterialsUseCase.
  rpc FindOrderableMaterials(FindOrderableMaterialsRequest) returns (FindOrderableMaterialsResponse);
}

message FindOrderableMaterialsRequest {
}

message FindOrderableMaterialsResponse {
  // By material code
  repeated OrderableMaterial materials = 1;
}

// masterData's OrderableMaterial: a material that can be ordered, with the supplier it is bought from
message OrderableMaterial {
  MaterialReference material = 1;
  // UUID
  string supplier_id = 2;
  optional string supplier_code = 3;
  optional string supplier_name = 4;
  optional string category_name = 5;
  // The quantity an order of it is usually sized from
  optional int32 economic_order_quantity = 6;
}

message FindMaterialRequest {
  // UUID
  string material_id = 1;
}

message FindMaterialByCodeRequest {
  string material_code = 1;
}

message FindMaterialResponse {
  // Absent when no material matches.
  optional MaterialReference material = 1;
}

// masterData's MaterialReference
message MaterialReference {
  string id = 1;
  optional string code = 2;
  optional string name = 3;
  optional string description = 4;
  optional string unit_of_measure_code = 5;
  optional materia.common.v1.Money standard_price = 6;
  bool orderable = 7;
}
