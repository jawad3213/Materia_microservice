# ===================================================================
# Finance service: test configuration
# ===================================================================
# The main application.properties takes the token keys from the environment with no default, so the tests could
# not start without this file. Every value is explicit, so the suite runs on a clean clone with no .env file.
# Datasource properties are overridden at runtime by AbstractIntegrationTest (Testcontainers PostgreSQL).
# ===================================================================

spring.application.name=finance-service-test
spring.datasource.url=jdbc:postgresql://localhost:5432/materia_test
spring.datasource.username=test
spring.datasource.password=test

# ---- Flyway ----
# The service's own migrations, its copy of the shared kernel's tables included, on a database of its own.
# Strict, as in the monolith's tests.
spring.flyway.locations=classpath:db/finance
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ---- Messaging ----
# In-process Spring events, so the suite needs no Kafka broker.
app.messaging.type=spring
app.outbox.relay.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
# Integration events run inside the test transaction, so rolled-back tests still see their effects.
app.events.in-process.mode=immediate

# ---- Security ----
# The monolith's suite's fixed RSA key pair (test-only keys; they grant nothing outside the suite).
jwt.private-
jwt.public-
jwt.expiration-ms=900000
# This service's client credentials for its service tokens; test-only.
app.service-client.secret=test-service-client-secret
# Identity and procurement (the monolith) are other services: the tests reach in-process stand-ins
# (support/fixtures/TestIdentity, TestProcurement).
app.grpc.identity.target=in-process:test-identity
app.grpc.monolith.target=in-process:test-procurement
app.security.public-endpoints=/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/logout,/api/v1/auth/forgot-password,/api/v1/auth/reset-password
app.cors.allowed-origins=http://localhost:5173
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.same-site=Lax
# Off, as in the monolith's suite: its budgets would make web tests depend on their speed.
gateway.rate-limit.enabled=false

# ---- gRPC ----
# Any free port: tests reach finance.v1 in process.
app.grpc.server.port=0

# ---- OpenAPI (disabled; nothing under test needs it) ----
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---- Misc ----
server.port=0
app.attachments.storage-dir=target/test-attachments
# No exchange-rate job in tests (it would call the external API at start-up).
app.fx.refresh.enabled=false
