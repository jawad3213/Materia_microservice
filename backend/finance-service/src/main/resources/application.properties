# ===================================================================
# Finance service: invoices, payments, the settings they use
# ===================================================================
server.port=${SERVER_PORT:8084}
spring.application.name=${SPRING_APPLICATION_NAME:finance-service}
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.jdbc.batch_size=${SPRING_JPA_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=${SPRING_JPA_ORDER_INSERTS:true}
spring.jpa.properties.hibernate.order_updates=${SPRING_JPA_ORDER_UPDATES:true}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.format-sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate

# Finance's tables are in the finance schema; the shared kernel's (change history, outbox, inbox, code sequences,
# attachments, exchange rates) are in public, owned by the monolith's migrations until each service gets its own
# database. public comes first: the schema Hibernate checks the shared kernel's entities against.
spring.datasource.hikari.connection-init-sql=SET search_path TO public, finance

# Finance owns its tables' migrations (db/finance), with its own history in the finance schema. Baseline 0, so that
# on a database where the monolith created the tables, V1 (all "if not exists") and V2 still run.
spring.flyway.schemas=finance
spring.flyway.default-schema=finance
spring.flyway.table=flyway_schema_history
spring.flyway.locations=classpath:db/finance
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ===================================================================
# gRPC: finance.v1 (FinanceMetrics) for the other services; calls to identity and procurement
# ===================================================================
app.grpc.server.port=${GRPC_SERVER_PORT:9093}
app.grpc.identity.target=${GRPC_IDENTITY_TARGET:localhost:9091}
app.grpc.identity.deadline=${GRPC_IDENTITY_DEADLINE:5s}
# procurement.v1 (PurchaseOrderLookup, GoodsReceiptLookup), served by the monolith
app.grpc.monolith.target=${GRPC_MONOLITH_TARGET:localhost:9090}
app.grpc.monolith.deadline=${GRPC_MONOLITH_DEADLINE:5s}
# This service's client credentials for its service tokens (identity.v1.ServiceTokens).
app.service-client.id=finance
app.service-client.secret=${SERVICE_CLIENT_FINANCE_SECRET}

# ===================================================================
# Events: finance reacts to no other service's event. Its own are recorded in the shared outbox, which the monolith's
# relay publishes, so it runs no relay and no Kafka consumer of its own.
# ===================================================================
app.messaging.type=spring
app.outbox.relay.enabled=false

# ===================================================================
# JWT: verified with identity's public key only
# ===================================================================
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ===================================================================
# Security & CORS
# ===================================================================
app.security.public-endpoints=${APP_SECURITY_PUBLIC_ENDPOINTS:/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/actuator/health,/actuator/health/**,/actuator/info,/error}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.max-requests-per-minute=${GATEWAY_RATE_LIMIT_MAX_RPM:120}
gateway.rate-limit.max-auth-requests-per-minute=${GATEWAY_RATE_LIMIT_AUTH_MAX_RPM:10}

springdoc.info.title=${SPRINGDOC_INFO_TITLE:Materia Finance API}

# ===================================================================
# Actuator
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=materia-finance
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===================================================================
# Jobs and shared kernel
# ===================================================================
# Invoice lines whose price differs from the order's by more than this are flagged (the Settings page overrides it).
app.invoice.price-tolerance-percent=${APP_INVOICE_PRICE_TOLERANCE_PERCENT:2}
app.scheduling.enabled=false
app.reporting-currency=${APP_REPORTING_CURRENCY:MAD}
# Exchange rates are refreshed by the monolith (shared exchange_rates table).
app.fx.refresh.enabled=false
# Supplier invoice scans: the monolith's attachments (shared table, same directory) until each service has its own.
app.attachments.storage-dir=${APP_ATTACHMENTS_DIR:data/attachments}
app.attachments.max-file-size-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
