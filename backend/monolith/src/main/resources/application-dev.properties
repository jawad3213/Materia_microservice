# ===================================================================
# Development Environment Configuration (application-dev.properties)
# ===================================================================

# Database Connection (Reads from .env)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate: the schema comes from Flyway and Hibernate validates it (see application.properties).

# Swagger / OpenAPI Development Overrides
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Kafka Development Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}


# Demo data (dev profile only; see common/infrastructure/seed/DevSeed): on start-up, an empty database gets the dev
# accounts admin@, purchaser@ and receiver@materia.com, master data, requisitions and purchase orders.
app.seed.demo-data=${APP_SEED_DEMO_DATA:true}
# Password of the three dev accounts (offered on the login page in development).
app.seed.password=${APP_SEED_PASSWORD:Materia.Dev1!}
