spring.application.name=backend2


# TLS is terminated at the load balancer, so trust X-Forwarded-* for
# request.isSecure() and generated URLs.
server.forward-headers-strategy=framework

# Session cookie must be Secure over HTTPS.
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Strict}


# Database schema: Flyway builds it from db/migration (V1__init.sql, then V2__..., V3__...) and Hibernate only
# validates that the entities match it, failing the start when they do not. Strict on purpose: an empty
# database is migrated, a database with unknown or altered migrations is refused instead of patched.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.ignore-migration-patterns=*:future
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
