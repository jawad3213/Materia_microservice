# ===================================================================
# Test Configuration
# ===================================================================
# The main application.properties resolves every setting from environment
# variables with no defaults, so the context cannot start under test without
# this file. Each value below is supplied explicitly so the suite runs on a
# clean clone with no .env file and no manual setup (FR-012, SC-007).
#
# Datasource properties are overridden at runtime by AbstractIntegrationTest
# via @DynamicPropertySource, pointing at the Testcontainers PostgreSQL
# instance. The values here only need to be resolvable, not reachable.
# ===================================================================

spring.application.name=backend2-test
# The test profile is activated by SPRING_PROFILES_ACTIVE=test, set in the Surefire
# configuration. spring.profiles.active cannot be set here: Spring Boot rejects it
# inside a profile-specific file.

# ---- Datasource (overridden per-run by the container) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/materia_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# validate, not create: the schema comes from Flyway, so any drift between an
# entity mapping and its migration fails the build immediately.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.format-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ---- Flyway ----
# Strict in tests: unlike production, a missing or altered migration should fail
# loudly rather than be ignored.
spring.flyway.enabled=true
spring.flyway.default-schema=public
# Tests build the schema from the production migrations, so a script that no longer matches
# the entities fails the suite the way it would fail a deployment (ddl-auto=validate).
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
# Nothing in the suite needs to wipe a schema. Keeping clean disabled means a
# misconfigured datasource can never result in a destroyed database.
spring.flyway.clean-disabled=true

# ---- Messaging ----
# In-process Spring events, so the suite needs no Kafka broker (FR-012).
app.messaging.type=spring
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# ---- Security ----
# A fixed RSA key pair so signed tokens are reproducible across runs and machines
# (FR-011). Base64 of the PEM, as deployments configure it. Test-only keys,
# generated for this suite; they grant nothing outside it.
jwt.private-
jwt.public-
jwt.expiration-ms=900000
# Service-token client credentials (identity.v1.ServiceTokens); test-only.
app.service-client.id=monolith
app.service-client.secret=test-service-client-secret
# Identity is a separate service: the tests reach an in-process stand-in (support/fixtures/TestIdentity).
app.grpc.identity.target=in-process:test-identity
app.security.public-endpoints=/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/logout,/api/v1/auth/forgot-password,/api/v1/auth/reset-password
app.cors.allowed-origins=http://localhost:5173
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.same-site=Lax

# Rate limiting is off in tests. Its default of 10 auth requests per minute would
# make web tests fail with 429 depending on how fast they happen to run, which is
# exactly the order- and speed-dependence FR-011 forbids. Rate limiting gets its
# own dedicated test, which enables it explicitly.
gateway.rate-limit.enabled=false

# ---- Mail ----
# No SMTP server in tests; the sender port is mocked or stubbed per test.
spring.mail.host=localhost
spring.mail.port=3025

# ---- OpenAPI (disabled; nothing under test needs it) ----
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.info.title=Materia API (test)
springdoc.info.description=Test profile
springdoc.info.version=test
springdoc.info.contact.name=test
springdoc.info.contact.email=test@example.com

# ---- External services ----
# Unreachable by design: no test may depend on an external call (FR-012).
EXCHANGE_BASE_URL=http://localhost:9999/unused
EXCHANGE_API_KEY=test-key

# ---- Misc ----
server.port=0

# No exchange-rate job in tests (it would call the external API at start-up).
app.reporting-currency=MAD
app.fx.refresh.enabled=false
# No @Scheduled jobs in tests (the nightly reorder check would run against the test data).
app.scheduling.enabled=false
# Attachment files written by tests stay inside the build output.
app.attachments.storage-dir=target/test-attachments

# Integration events run inside the test transaction, so rolled-back tests still see their effects.
# IntegrationEventsIT checks the production after-commit delivery.
app.events.in-process.mode=immediate
