# ===================================================================
# Master data service: materials, categories, suppliers, stock
# ===================================================================
server.port=${SERVER_PORT:8083}
spring.application.name=${SPRING_APPLICATION_NAME:masterdata-service}
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.jdbc.batch_size=${SPRING_JPA_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=${SPRING_JPA_ORDER_INSERTS:true}
spring.jpa.properties.hibernate.order_updates=${SPRING_JPA_ORDER_UPDATES:true}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.format-sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate

# Master data's tables and its copy of the shared kernel's (change history, outbox, inbox, code sequences,
# attachments, exchange rates) are in the masterdata schema, which its connection sees alone: no other service's
# tables, nor the public ones every service shared before (one database per service, phase 6). The shared
# kernel's entities, which name no schema, and native SQL find their tables there.
spring.datasource.hikari.connection-init-sql=SET search_path TO masterdata

# Master data owns its tables' migrations (db/masterdata), with its own history in the masterdata schema. Baseline 0,
# so that on a database where the monolith created the tables, V1 (all "if not exists") and V2 still run.
spring.flyway.schemas=masterdata
spring.flyway.default-schema=masterdata
spring.flyway.table=flyway_schema_history
spring.flyway.locations=classpath:db/masterdata
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ===================================================================
# gRPC: masterdata.v1 (MaterialCatalog, MasterDataMetrics) for the other services; calls to identity and procurement
# ===================================================================
app.grpc.server.port=${GRPC_SERVER_PORT:9092}
app.grpc.identity.target=${GRPC_IDENTITY_TARGET:localhost:9091}
app.grpc.identity.deadline=${GRPC_IDENTITY_DEADLINE:5s}
# procurement.v1.Replenishment, served by the monolith
app.grpc.monolith.target=${GRPC_MONOLITH_TARGET:localhost:9090}
app.grpc.monolith.deadline=${GRPC_MONOLITH_DEADLINE:10s}
# This service's client credentials for its service tokens (identity.v1.ServiceTokens).
app.service-client.id=masterdata
app.service-client.secret=${SERVICE_CLIENT_MASTERDATA_SECRET}

# ===================================================================
# Events: stock follows procurement's events (StockOnOrderChanged, GoodsReceiptLineReceived, ReplacementPutOnOrder),
# which only reach this service through Kafka. Its own consumer group, so it receives every event the monolith's
# group also receives. Its outbox relay publishes its own events (ReceiptStockApplied...).
# ===================================================================
app.messaging.type=kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.auto-startup=${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}
app.events.consumer-group=materia-masterdata
app.outbox.relay.enabled=true

# ===================================================================
# JWT: verified with identity's public key only
# ===================================================================
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ===================================================================
# Security & CORS
# ===================================================================
app.security.public-endpoints=${APP_SECURITY_PUBLIC_ENDPOINTS:/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/actuator/health,/actuator/health/**,/actuator/info,/error}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.max-requests-per-minute=${GATEWAY_RATE_LIMIT_MAX_RPM:120}
gateway.rate-limit.max-auth-requests-per-minute=${GATEWAY_RATE_LIMIT_AUTH_MAX_RPM:10}

springdoc.info.title=${SPRINGDOC_INFO_TITLE:Materia Master Data API}

# ===================================================================
# Actuator
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=materia-masterdata
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===================================================================
# Jobs and shared kernel
# ===================================================================
# The nightly reorder check (ReorderService) runs here.
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}
app.reporting-currency=${APP_REPORTING_CURRENCY:MAD}
# Exchange rates are refreshed by the monolith (shared exchange_rates table).
app.fx.refresh.enabled=false
app.attachments.storage-dir=${APP_ATTACHMENTS_DIR:data/attachments}
