# Development profile: the database from the environment, API docs on, and the dev accounts and employees seeded
# (the monolith's and master data's seeders look the dev accounts up here).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
app.seed.demo-data=${APP_SEED_DEMO_DATA:true}
app.seed.password=${APP_SEED_PASSWORD:Materia.Dev1!}
