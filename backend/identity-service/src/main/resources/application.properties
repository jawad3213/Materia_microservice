# ===================================================================
# Identity service: accounts, sign-in, tokens, employees
# ===================================================================
server.port=${SERVER_PORT:8082}
spring.application.name=${SPRING_APPLICATION_NAME:identity-service}
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.jdbc.batch_size=${SPRING_JPA_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=${SPRING_JPA_ORDER_INSERTS:true}
spring.jpa.properties.hibernate.order_updates=${SPRING_JPA_ORDER_UPDATES:true}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.format-sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate

# Identity's tables and its copy of the shared kernel's (change history, outbox, inbox, code sequences,
# attachments, exchange rates) are in the identity schema, which its connection sees alone: no other service's
# tables, nor the public ones every service shared before (one database per service, phase 6). The shared
# kernel's entities, which name no schema, and native SQL find their tables there.
spring.datasource.hikari.connection-init-sql=SET search_path TO identity

# Identity owns its tables' migrations (db/identity), with its own history in the identity schema. Baseline 0, so
# that on a database where procurement created the tables, V1 (all "if not exists") and V2 still run.
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
spring.flyway.table=flyway_schema_history
spring.flyway.locations=classpath:db/identity
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ===================================================================
# gRPC: identity.v1 (UserDirectory) for the other services; their service tokens come from Keycloak
# ===================================================================
app.grpc.server.port=${GRPC_SERVER_PORT:9091}

# ===================================================================
# Keycloak's admin API: identity creates, renames and disables the accounts there, as its own client (a service
# account with realm-management's manage-users; manage-realm too while accounts from before Keycloak remain to import).
# ===================================================================
app.service-client.id=${SERVICE_CLIENT_IDENTITY_ID:identity}
app.service-client.secret=${SERVICE_CLIENT_IDENTITY_SECRET:}
# The accounts from before Keycloak, still holding a password hash here, are imported at start-up (KeycloakAccountImport)
app.keycloak.import-accounts=${KEYCLOAK_IMPORT_ACCOUNTS:true}

# ===================================================================
# Events: identity's own handlers run in process; its outbox relay publishes its events to Kafka
# (materia.<context>.events), for any other service, and its consumer group receives the others'.
# ===================================================================
app.messaging.type=kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.auto-startup=${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}
app.events.consumer-group=materia-identity
app.outbox.relay.enabled=true

# ===================================================================
# Access tokens: Keycloak issues them all, users' and services' own (docs/architecture/keycloak-migration.md), and
# this service verifies them with the realm's keys: KEYCLOAK_ISSUER_URI as tokens state it, the realm reached there
# unless KEYCLOAK_REALM_URI gives the address this service reaches it at (in docker compose:
# http://keycloak:8080/auth/realms/materia), which also gives it its own service tokens.
# ===================================================================
app.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI}
app.keycloak.realm-uri=${KEYCLOAK_REALM_URI:}
app.keycloak.audience=${KEYCLOAK_AUDIENCE:materia-api}

# ===================================================================
# Security & CORS
# ===================================================================
app.security.public-endpoints=${APP_SECURITY_PUBLIC_ENDPOINTS:/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/actuator/health,/actuator/health/**,/actuator/info,/error}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.max-requests-per-minute=${GATEWAY_RATE_LIMIT_MAX_RPM:120}
gateway.rate-limit.max-auth-requests-per-minute=${GATEWAY_RATE_LIMIT_AUTH_MAX_RPM:10}

springdoc.info.title=${SPRINGDOC_INFO_TITLE:Materia Identity API}

# ===================================================================
# Actuator
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=materia-identity
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===================================================================
# Mail (password reset, account created)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${APP_MAIL_FROM:noreply@materia.com}
app.mail.login-base-url=${APP_LOGIN_URL:http://localhost:5173/signin}

# First administrator of a fresh install: created only while the users table is empty.
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# ===================================================================
# Shared kernel features identity does not use
# ===================================================================
app.reporting-currency=${APP_REPORTING_CURRENCY:MAD}
app.fx.refresh.enabled=false
app.scheduling.enabled=false
app.attachments.storage-dir=${APP_ATTACHMENTS_DIR:data/attachments}
