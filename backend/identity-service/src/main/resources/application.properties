# ===================================================================
# Identity service: accounts, sign-in, tokens, employees
# ===================================================================
server.port=${SERVER_PORT:8082}
spring.application.name=${SPRING_APPLICATION_NAME:identity-service}
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.jdbc.batch_size=${SPRING_JPA_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=${SPRING_JPA_ORDER_INSERTS:true}
spring.jpa.properties.hibernate.order_updates=${SPRING_JPA_ORDER_UPDATES:true}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.format-sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate

# Identity's tables are in the identity schema; the shared kernel's (change history, outbox, inbox, code sequences,
# attachments, exchange rates) are in public, owned by the monolith's migrations until each service gets its own
# database. public comes first: the schema Hibernate checks the shared kernel's entities against.
spring.datasource.hikari.connection-init-sql=SET search_path TO public, identity

# Identity owns its tables' migrations (db/identity), with its own history in the identity schema. Baseline 0, so
# that on a database where the monolith created the tables, V1 (all "if not exists") and V2 still run.
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
spring.flyway.table=flyway_schema_history
spring.flyway.locations=classpath:db/identity
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ===================================================================
# gRPC: identity.v1 (UserDirectory, ServiceTokens) for the other services
# ===================================================================
app.grpc.server.port=${GRPC_SERVER_PORT:9091}
# The services identity issues service tokens to, with their secrets.
app.service-clients.monolith=${SERVICE_CLIENT_MONOLITH_SECRET:}
app.service-clients.masterdata=${SERVICE_CLIENT_MASTERDATA_SECRET:}
app.service-clients.finance=${SERVICE_CLIENT_FINANCE_SECRET:}
app.service-clients.analytics=${SERVICE_CLIENT_ANALYTICS_SECRET:}

# ===================================================================
# Events: identity's own handlers run in process; the monolith's outbox relay publishes the shared outbox (identity's
# events included) to Kafka, so identity runs no relay of its own.
# ===================================================================
app.messaging.type=spring
app.outbox.relay.enabled=false

# ===================================================================
# JWT: identity is the only signer
# ===================================================================
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ===================================================================
# Security & CORS
# ===================================================================
app.security.public-endpoints=${APP_SECURITY_PUBLIC_ENDPOINTS:/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/logout,/api/v1/auth/forgot-password,/api/v1/auth/reset-password,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/actuator/health,/actuator/health/**,/actuator/info,/error}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.max-requests-per-minute=${GATEWAY_RATE_LIMIT_MAX_RPM:120}
gateway.rate-limit.max-auth-requests-per-minute=${GATEWAY_RATE_LIMIT_AUTH_MAX_RPM:10}

springdoc.info.title=${SPRINGDOC_INFO_TITLE:Materia Identity API}

# ===================================================================
# Actuator
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=materia-identity
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===================================================================
# Mail (password reset, account created)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${APP_MAIL_FROM:noreply@materia.com}
app.mail.reset-password-base-url=${APP_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
app.mail.login-base-url=${APP_LOGIN_URL:http://localhost:5173/signin}

# First administrator of a fresh install: created only while the users table is empty.
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# ===================================================================
# Shared kernel features identity does not use
# ===================================================================
app.reporting-currency=${APP_REPORTING_CURRENCY:MAD}
app.fx.refresh.enabled=false
app.scheduling.enabled=false
app.attachments.storage-dir=${APP_ATTACHMENTS_DIR:data/attachments}
