spring.application.name=gateway-service
server.port=${SERVER_PORT:8080}

# Where the REST API is served: procurement (docker compose service "procurement"; "backend" on EC2).
gateway.procurement-uri=${GATEWAY_PROCUREMENT_URI:http://localhost:8080}
# Identity (/api/v1/auth, /api/v1/employees); procurement when empty.
gateway.identity-uri=${GATEWAY_IDENTITY_URI:}
# Master data (/api/v1/masterdata); procurement when empty.
gateway.master-data-uri=${GATEWAY_MASTERDATA_URI:}
# Finance (/api/v1/invoices, /api/v1/payments, /api/v1/settings); procurement when empty.
gateway.finance-uri=${GATEWAY_FINANCE_URI:}
# Analytics (/api/v1/dashboard); procurement when empty.
gateway.analytics-uri=${GATEWAY_ANALYTICS_URI:}
# The Keycloak realm whose tokens are accepted (docs/architecture/keycloak-migration.md): its issuer, as tokens state
# it; its keys are fetched at the issuer unless KEYCLOAK_REALM_URI gives the address the gateway reaches it at.
gateway.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI}
gateway.keycloak.realm-uri=${KEYCLOAK_REALM_URI:}
gateway.keycloak.audience=${KEYCLOAK_AUDIENCE:materia-api}

gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.max-requests-per-minute=${GATEWAY_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:120}
gateway.rate-limit.window-seconds=60

# Request headers, X-Real-IP from nginx included, go to the service unchanged, so its own limiter and logs see the
# client's address rather than the gateway's.

# Actuator on its own port, reachable only inside the compose network (health check, Prometheus).
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
